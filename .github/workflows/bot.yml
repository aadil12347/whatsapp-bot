name: WhatsApp Bot Task Runner (24/7 Scheduled)

on:
  schedule:
    - cron: '5 */4 * * *'  # Triggers every 4 hours + 5 min buffer (00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC)
  workflow_dispatch:
    inputs:
      command:
        description: 'Optional command or task to execute'
        required: false
        default: 'start'
  repository_dispatch:
    types: [run-bot, execute-task]

permissions:
  contents: write
  actions: write

jobs:
  run-bot-task:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: ⚙️ Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🛡️ Launch FlareSolverr Service
        run: |
          docker run -d --name=flaresolverr -p 8191:8191 -e LOG_LEVEL=info -e SESSION_TIMEOUT=60000 ghcr.io/flaresolverr/flaresolverr:latest
          echo "Waiting 5s for FlareSolverr container to warm up..."
          sleep 5

      - name: 🤖 Execute Bot Task (4-Hour Shift)
        env:
          URL: '${{ secrets.URL }}'
          KEY: '${{ secrets.KEY }}'
          NUMBER: '${{ secrets.NUMBER }}'
          SUPABASE_URL: '${{ secrets.URL }}'
          SUPABASE_KEY: '${{ secrets.KEY }}'
          BOT_NUMBER: '${{ secrets.NUMBER }}'
          SUDO: '${{ secrets.NUMBER }}'
          FLARESOLVERR_URL: 'http://localhost:8191/v1'
          MAX_RUN_TIME_MINUTES: '240'
        run: |
          echo "🚀 Restoring paired keys from Supabase & running bot for 240 mins (4 hours)..."
          node start.js

      - name: 📤 Sync Paired Keys to Supabase
        if: always()
        env:
          URL: '${{ secrets.URL }}'
          KEY: '${{ secrets.KEY }}'
          SUPABASE_URL: '${{ secrets.URL }}'
          SUPABASE_KEY: '${{ secrets.KEY }}'
        run: |
          echo "📤 Backing up paired keys (sess/) to Supabase..."
          pnpm exec node scratch/upload_current_session.js || true
