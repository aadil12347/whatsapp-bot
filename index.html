<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot Remote Controller</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-color: #f8fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .repo-tag { color: #94a3b8; font-size: 0.8rem; margin-bottom: 24px; word-break: break-all; }
        .btn {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .btn:active { transform: scale(0.98); }
        .btn-start { background-color: var(--accent-green); }
        .btn-stop { background-color: var(--accent-red); }
        .btn-status { background-color: #3b82f6; }
        #status-box {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background-color: #0f172a;
            font-size: 0.9rem;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Bot Controller</h1>
    <div class="repo-tag">griffithbuildwiseestimation-cmd/whatsapp-bot</div>

    <button id="startBtn" class="btn btn-start" onclick="startBot()">🚀 START BOT</button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopBot()">🛑 STOP BOT</button>
    <button class="btn btn-status" onclick="checkStatus()">📊 REFRESH STATUS</button>

    <div id="status-box">Loading status...</div>
</div>

<script>
    function getToken() {
        let token = localStorage.getItem('GH_TOKEN');
        if (!token) {
            token = prompt("Please enter your GitHub Personal Access Token (PAT):");
            if (token) {
                localStorage.setItem('GH_TOKEN', token.trim());
            }
        }
        return token;
    }

    const OWNER = "griffithbuildwiseestimation-cmd";
    const REPO = "whatsapp-bot";

    const logBox = document.getElementById('status-box');

    async function startBot() {
        const token = getToken();
        if (!token) return logBox.innerText = "❌ Token required.";
        logBox.innerText = "⏳ Sending start signal...";
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ event_type: 'run-bot' })
            });

            if (res.status === 204) {
                logBox.innerText = "✅ Bot started on GitHub Actions!";
                setTimeout(checkStatus, 3000);
            } else {
                const text = await res.text();
                logBox.innerText = "❌ Error: " + text;
            }
        } catch (e) {
            logBox.innerText = "❌ Error: " + e.message;
        }
    }

    async function stopBot() {
        const token = getToken();
        if (!token) return logBox.innerText = "❌ Token required.";
        logBox.innerText = "⏳ Stopping active runs...";
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?status=in_progress`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const runs = data.workflow_runs || [];

            if (runs.length === 0) {
                logBox.innerText = "ℹ️ No active bot runs found to stop.";
                return;
            }

            for (const run of runs) {
                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${run.id}/cancel`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            }
            logBox.innerText = "🛑 Stop signal sent!";
            setTimeout(checkStatus, 3000);
        } catch (e) {
            logBox.innerText = "❌ Error: " + e.message;
        }
    }

    async function checkStatus() {
        const token = getToken();
        if (!token) return logBox.innerText = "🔑 Enter token to check status.";
        logBox.innerText = "⏳ Checking status...";
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?per_page=1`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const run = (data.workflow_runs || [])[0];

            if (!run) {
                logBox.innerText = "ℹ️ No workflow runs recorded yet.";
                return;
            }

            if (run.status === 'in_progress') {
                logBox.innerText = `🟢 RUNNING (Run #${run.run_number})`;
            } else {
                logBox.innerText = `🔴 STOPPED (Last status: ${run.conclusion || run.status})`;
            }
        } catch (e) {
            logBox.innerText = "❌ Error: " + e.message;
        }
    }

    checkStatus();
</script>
</body>
</html>
