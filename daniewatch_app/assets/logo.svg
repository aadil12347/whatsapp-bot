<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1210" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Champagne Gold Metallic Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E4" />
      <stop offset="40%" stop-color="#F8E7C9" />
      <stop offset="100%" stop-color="#C5A069" />
    </linearGradient>

    <!-- Glowing Emerald Accent Gradient -->
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="10" />

  <!-- Outer Glowing Ring Accent -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#emeraldGradient)" stroke-width="3" opacity="0.6" filter="url(#glow)" />

  <!-- Bold Letter 'D' combined with Play Icon -->
  <!-- Outer D Spine & Arc -->
  <path fill="url(#goldGradient)" filter="url(#glow)" d="
    M 156 126
    L 250 126
    C 336 126, 396 176, 396 256
    C 396 336, 336 386, 250 386
    L 156 386
    Z
  "/>

  <!-- Inner D Hole (Cutout) to form exact letter D -->
  <path fill="url(#bgGradient)" d="
    M 206 176
    L 242 176
    C 292 176, 336 206, 336 256
    C 336 306, 292 336, 242 336
    L 206 336
    Z
  "/>

  <!-- Play Button Triangle Embedded in Center of 'D' -->
  <polygon points="228,212 306,256 228,300" fill="url(#emeraldGradient)" filter="url(#glow)" />
</svg>
