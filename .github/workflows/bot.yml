name: WhatsApp Bot Task Runner

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Optional command or task to execute'
        required: false
        default: 'start'
  repository_dispatch:
    types: [run-bot, execute-task]

jobs:
  run-bot-task:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: ⚙️ Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🤖 Execute Bot Task
        env:
          URL: '${{ secrets.URL }}'
          KEY: '${{ secrets.KEY }}'
          NUMBER: '${{ secrets.NUMBER }}'
          SUPABASE_URL: '${{ secrets.URL }}'
          SUPABASE_KEY: '${{ secrets.KEY }}'
          BOT_NUMBER: '${{ secrets.NUMBER }}'
          SUDO: '${{ secrets.NUMBER }}'
          MAX_RUN_TIME_MINUTES: '280'
        run: |
          echo "🚀 Restoring paired keys from Supabase & running bot..."
          node start.js

      - name: 📤 Sync Paired Keys to Supabase
        if: always()
        env:
          URL: '${{ secrets.URL }}'
          KEY: '${{ secrets.KEY }}'
          SUPABASE_URL: '${{ secrets.URL }}'
          SUPABASE_KEY: '${{ secrets.KEY }}'
        run: |
          echo "📤 Backing up paired keys (sess/) to Supabase..."
          pnpm exec node scratch/upload_current_session.js || true
